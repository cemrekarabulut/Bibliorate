version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: bibliorate-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bibliorate
      MYSQL_USER: bibliorate_user
      MYSQL_PASSWORD: bibliorate_pass
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: bibliorate-api
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=bibliorate;User=bibliorate_user;Password=bibliorate_pass;
      - Jwt__Key=bibliorate-super-secret-jwt-key-2026
      - FlaskApi__BaseUrl=http://analysis:5000
      - ASPNETCORE_URLS=http://+:8080

volumes:
  mysql_data: