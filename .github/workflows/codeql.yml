# CodeQL Advanced — devre dışı bırakıldı.
# Repo'da GitHub Code Scanning etkin olmadığı için her push'ta hata veriyordu.
# Yeniden etkinleştirmek için: on: push satırını geri ekle ve
# GitHub repo Settings > Code security > Code scanning'i aç.

name: "CodeQL Advanced"

on:
  workflow_dispatch:   # sadece manuel tetikleme ile çalışır, push'ta değil

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: csharp
            build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
