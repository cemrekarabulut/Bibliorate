name: BiblioRate CI Pipeline

on:
  push:
    branches: [ "main", "cemre" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './src/BiblioRate.sln'
  DOCKERFILE_PATH: './src/Dockerfile'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release

      - name: Run unit tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build -c Release --verbosity normal
        continue-on-error: true   # Test projesi yoksa pipeline durmasın

  # ─────────────────────────────────────────
  # JOB 2: Docker Build Validation
  # ─────────────────────────────────────────
  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ${{ env.DOCKERFILE_PATH }}
          push: false          # Sadece build kontrolü; registry'e gönderme
          tags: bibliorate-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # JOB 3: Push to Docker Hub (main only)
  # ─────────────────────────────────────────
  docker-push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliorate-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliorate-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
