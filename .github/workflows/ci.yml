name: Bibliorate CI Pipeline

on:
  push:
    branches:
      - main           # Production — stabil branch
      - cemre          # Cemre Karabulut  (Backend & API)
      - caglar-branch  # Çağlar Mesci     (Frontend UI/UX)
      - berra          # Berra Senem Mıynat (Flask Analytics)
  pull_request:
    branches: [ "main" ]

# ─────────────────────────────────────────────────────────────
#  Pipeline; üç bağımsız stack'i paralel doğrular:
#    1) .NET 9 API         (src/)
#    2) Python Flask       (analysis/)
#    3) React Frontend     (client/)
#  Ardından Docker build validasyonu ve isteğe bağlı push yapılır.
# ─────────────────────────────────────────────────────────────

jobs:

  # ──────────────────────────────────────────
  # JOB 1 — .NET 9 API (C# Backend)
  # ──────────────────────────────────────────
  dotnet-ci:
    name: ".NET API — Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: dotnet restore src/BiblioRate.sln

      - name: Build (Release)
        run: dotnet build src/BiblioRate.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test src/BiblioRate.sln --no-build -c Release --verbosity normal
        continue-on-error: true   # Test projesi henüz yoksa pipeline durmasın

  # ──────────────────────────────────────────
  # JOB 2 — Python Flask Microservice
  # ──────────────────────────────────────────
  flask-ci:
    name: "Flask Analytics — Lint & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f analysis/requirements.txt ]; then
            pip install -r analysis/requirements.txt
          fi
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # Söz dizimi hatalarını ve undefined name'leri yakala
          flake8 analysis/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run pytest
        run: |
          if [ -d analysis/tests ]; then
            pytest analysis/tests/ -v --tb=short
          else
            echo "⚠️  Henüz test dizini yok (analysis/tests/), adım atlandı."
          fi
        continue-on-error: true

  # ──────────────────────────────────────────
  # JOB 3 — React Frontend
  # ──────────────────────────────────────────
  react-ci:
    name: "React Frontend — Build Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install npm packages
        run: |
          if [ -f client/package.json ]; then
            cd client && npm ci
          else
            echo "⚠️  client/package.json bulunamadı, adım atlandı."
          fi

      - name: Build React app
        run: |
          if [ -f client/package.json ]; then
            cd client && npm run build --if-present
          fi
        continue-on-error: true

  # ──────────────────────────────────────────
  # JOB 4 — Docker Image Build Validation
  # ──────────────────────────────────────────
  docker-build:
    name: "Docker — Image Build Validation"
    runs-on: ubuntu-latest
    needs: [ dotnet-ci, flask-ci, react-ci ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .NET API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: false
          tags: bibliorate-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # JOB 5 — Docker Push (main branch only)
  # ──────────────────────────────────────────
  docker-push:
    name: "Docker — Push to Registry"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push .NET API image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliorate-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bibliorate-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
